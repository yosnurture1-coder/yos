<script>
"use strict";
// ============================================================
//  영수증 정산 — 올리는 사람 화면
//   본인(이름 · 휴대폰 뒤 4자리 · 돌려받을 계좌) → 사역마다 영수증 넣기 → [제출하기] → 낸 내역에서 확인 · 취소

//   쓰던 사역은 이 폰에 저장해 두었다가 다시 열면 이어 씀
// ============================================================
const 나키 = "receipt-settle.me.v1" + (연결표 ? "." + 연결표 : "");        // 링크(담당자)마다 따로 — 팀 목록이 다르고, 올린 사진도 그 담당자 드라이브에 있어서
const 창고이름 = "receipt-settle-submit" + (연결표 ? "-" + 연결표 : "");
const 붙임최대 = 3;

const S = {
  화면: "본인", 탭: "작성",
  나: { 이름: "", 전화: "", 팀: "", 은행: "", 계좌: "", 예금주: "" }, 기억: true, 메시지: "",
  사역: [], 제출ID: "",
  열린: "", 지울확인: "", 비울확인: "",
  서버: null, 내역: { 상태: "", 값: [], 안내: "" },
  보내는중: false, 제출오류: "", 완료: null,
  고른사역: "", 붙일곳: null, 뺀것: null, 취소확인: "", 취소중: "",
};
const 사역찾기 = id => S.사역.find(s => s.id === id);
const 문의주소 = () => (S.서버 && S.서버.설정 && S.서버.설정.문의) || "";
const 종이안내 = () => (S.서버 && S.서버.설정 && S.서버.설정.종이영수증안내) || "종이 영수증 원본은 정산 담당자에게 직접 전달해 주세요.";
const 팀목록 = () => (S.서버 && S.서버.설정 && Array.isArray(S.서버.설정.팀목록) && S.서버.설정.팀목록) || [];
const 연결글자 = () => { const t = (S.서버 && S.서버.설정) || {}; return [t.조직 || (t.국 ? t.국 : ""), t.담당자 ? "정산 담당 " + t.담당자 : ""].filter(Boolean).join(" · "); };
// 담당자마다 서버(Apps Script) 판이 다를 수 있어서, 그 서버가 받을 줄 아는 것만 보여 줌
const 서버됨 = 기 => !!(S.서버 && Array.isArray(S.서버.기능) && S.서버.기능.indexOf(기) >= 0);

// ---------- 번호 · 살펴보기 ----------
// 영수증 날짜는 영수증마다 (한 사역에 날짜가 다른 영수증이 섞여도 됨). 사역 순서는 가장 이른 영수증 날짜로
const 날짜들 = s => s.영수증.map(r => r.날짜).filter(Boolean).sort();
const 첫날 = s => 날짜들(s)[0] || "";
function 날짜범위글(s) {
  const d = 날짜들(s);
  if (!d.length) return "날짜 없음";
  return d[0] === d[d.length - 1] ? 날글(d[0]) : `${날글(d[0])} ~ ${날짧게(d[d.length - 1])}`;
}
function 순서() { return S.사역.slice().sort((a, b) => (첫날(a) || "9999-99-99").localeCompare(첫날(b) || "9999-99-99") || a.만든 - b.만든); }
function 번호표() { const m = new Map(); 순서().forEach((s, i) => m.set(s.id, i + 1)); return m; }

  for (const s of 순서()) s.영수증.forEach((r, k) => {
    const a = 정수(r.금액); if (!a || !r.날짜) return;

  });
  // 계정과목 · 사역 내용 · 사역팀이 같은 사역이 둘 이상 — 날짜별로 나눠 넣었을 수 있음 (한 사역 · 한 계정은 한 줄로 청구)

    const 키 = s.계정 + "|" + 이름키(s.내용) + "|" + 팀글(s.팀);

}
function 올리는중(r) { return r.사진.some(p => p.올림 === "대기" || p.올림 === "올리는중"); }

    if (S.서버 && !서버됨("이어내기")) 막("이 정산 링크는 이어 내기를 받지 않아요. 새 사역으로 내 주세요");
  } else {
    if (!g) 막("계정과목을 골라 주세요");
    if (!s.활동) 막("사역활동에 체크해 주세요");
    if (!s.내용.trim()) 막("사역 내용을 적어 주세요");
    if (g && g.단가 && !s.명단.length) 막("참가자 명단을 적어 주세요");
    if (g && g.단가 && 정수(s.한도) && !한도값(s)) 막("따로 정한 1인 한도는 1,000원에서 200,000원 사이로 적어 주세요");
    else if (g && g.단가 && 한도값(s)) 안(`교회에서 따로 정해 준 1인 한도(${원(한도값(s))}원)로 계산했어요. 담당자가 확인해요.`);
  }
  if (!s.영수증.length) 막("영수증을 넣어 주세요");
  s.영수증.forEach((r, k) => {
    const n = k + 1;
    if (r.사진.some(p => p.올림 === "실패")) 막(`영수증 ${n} 사진을 다시 올려 주세요`, r.id);
    else if (올리는중(r)) 막(`영수증 ${n} 사진을 올리는 중이에요`, r.id);
    if (!r.구분) 막(`영수증 ${n} 종이·전자를 골라 주세요`, r.id);
    else if (r.구분 === "전자" && !r.사진.length) 막(`영수증 ${n}은 전자영수증이라 캡처를 넣어 주세요`, r.id);
    if (!정수(r.금액)) 막(읽는중(r) ? `영수증 ${n} 금액을 읽는 중이에요` : `영수증 ${n} 금액을 적어 주세요`, r.id);
    else if (정수(r.금액) < 금액최소 || 정수(r.금액) > 금액최대) 막(`영수증 ${n} 금액을 다시 확인해 주세요`, r.id);
    const 읽 = r.읽기 || {};
    if (!r.날짜) 막(`영수증 ${n} 날짜를 골라 주세요`, r.id);
    else if (r.날짜 > 오늘()) 확(`영수증 ${n} 날짜가 아직 오지 않은 날짜예요`, r.id);
    if (읽.날짜 && r.날짜 && 읽.날짜 !== r.날짜) 확(`영수증 ${n}: 사진에서 읽은 날짜는 ${날짧게(읽.날짜)}이에요. 적은 날짜가 맞는지 봐 주세요`, r.id);
    const 짝 = 겹 && 겹.get(r.id);
    if (짝) 확(`영수증 ${n}과 ${짝.글}의 날짜·금액이 같아요. 같은 결제를 두 번 넣지 않았는지 확인해 주세요`, r.id);
  });
  const 날 = 날짜들(s).concat(이어 ? [이어.날짜, 이어.끝날].filter(Boolean) : []).sort();
  if (날.length > 1 && 날[0] !== 날[날.length - 1]) {
    // 예전 판 서버는 사역마다 날짜를 하나만 받음 (영수증마다 날짜를 적으면 첫 날짜로 모두 바뀜)
    if (!이어 && S.서버 && !서버됨("영수증날짜")) 막("이 정산 링크는 아직 한 사역에 영수증 날짜를 하나만 받아요. 날짜가 다른 영수증은 사역을 따로 추가해 주세요");
    else if ((Date.parse(날[날.length - 1]) - Date.parse(날[0])) / 864e5 > 31) 확(이어 ? "이미 낸 영수증과 날짜가 한 달 넘게 차이 나요. 같은 사역이 맞는지 봐 주세요" : "영수증 날짜가 한 달 넘게 차이 나요. 한 사역의 영수증이 맞는지 봐 주세요");
  }
  if (이어 && 이어.정산서) 안("담당자가 이미 교회 정산서를 만든 사역이에요. 이어 낸 영수증은 담당자가 확인해서 처리해요.");
  const 짝 = 겹 && 겹.같은 && 겹.같은.get(s.id);
  if (짝) 목록.push({ 수준: "확", 글: `${짝.번}번 사역과 계정과목·사역 내용이 같아요. 같은 사역이면 합쳐야 한 줄로 묶여 청구돼요. 다른 날 따로 한 모임이면 그대로 두세요.`, 합칠: 짝.id, 합칠번: 짝.번 });
  if (g && g.증빙) 안(g.증빙);

}
function 막힌까닭() {
  const 목록 = 순서(), 겹 = 겹침표();
  if (!목록.length) return "사역을 추가해 주세요";
  for (let i = 0; i < 목록.length; i++) {
    const 막 = 살펴보기(목록[i], 겹).find(x => x.수준 === "막");
    if (막) return `${i + 1}번 사역: ${막.글}`;

// ---------- 저장 (이 폰에만) ----------
function 창고열기() {
  return new Promise((ok, no) => {
    let q; try { q = indexedDB.open(창고이름, 1); } catch (e) { no(e); return; }
    q.onupgradeneeded = () => { if (!q.result.objectStoreNames.contains("draft")) q.result.createObjectStore("draft"); };
    q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); q.onblocked = () => no(new Error("blocked"));
  });
}
let 저장타이머 = 0, 마지막저장 = 0;
// 고칠 때마다 0.5초 뒤 임시 저장 — 쉬지 않고 고쳐도 2초에 한 번은 저장 (창을 닫거나 새로 고칠 때 잃는 것을 줄임)
function 저장() { clearTimeout(저장타이머); 저장타이머 = setTimeout(초안쓰기, Date.now() - 마지막저장 > 2000 ? 0 : 500); }
async function 초안쓰기() {
  마지막저장 = Date.now(); 저장타이머 = 0;
  try {
    const 값 = { v: 1, 제출ID: S.제출ID, 사역: S.사역.map(s => ({ id: s.id, 활동: s.활동, 내용: s.내용, 계정: s.계정, 팀: s.팀 || "", 한도: s.한도 || "", 명단: s.명단.slice(), 만든: s.만든,
      이어: s.이어 ? Object.assign({}, s.이어) : null,
      영수증: s.영수증.map(r => ({ id: r.id, 구분: r.구분, 금액: r.금액, 날짜: r.날짜 || "", 날짜출처: r.날짜출처 || "", 출처: r.출처, 따로: !!r.따로, 읽기: r.읽기 ? Object.assign({}, r.읽기) : null,
        사진: r.사진.map(p => ({ id: p.id, blob: p.blob, w: p.w, h: p.h, 파일id: p.파일id || "" })) })) })) };

}

    const 값 = await new Promise((ok, no) => { const tx = db.transaction("draft", "readonly"); const q = tx.objectStore("draft").get("current"); q.onsuccess = () => ok(q.result || null); q.onerror = () => no(q.error); });
    db.close();

    S.제출ID = 값.제출ID || "";
    S.사역 = 값.사역.map(s => ({ id: s.id || uid(), 활동: s.활동 || "", 내용: s.내용 || "", 계정: s.계정 || "", 팀: s.팀 || "", 한도: s.한도 || "", 명단: Array.isArray(s.명단) ? s.명단 : [], 만든: s.만든 || Date.now(),
      이어: s.이어 && s.이어.사역ID ? s.이어 : null,
      영수증: (s.영수증 || []).map(r => {
        let 읽기 = r.읽기 && typeof r.읽기 === "object" ? r.읽기 : null;
        if (읽기 && (읽기.상태 === "읽는중" || 읽기.상태 === "준비")) 읽기 = { 상태: "대기" };   // 읽다 만 금액은 다시 읽음
        return { id: r.id || uid(), 구분: r.구분 || "", 금액: r.금액 || "", 날짜: r.날짜 || s.날짜 || "", 날짜출처: r.날짜출처 || "", 출처: r.출처 || "", 따로: !!r.따로, 읽기,   // 예전 초안은 사역 날짜를 영수증마다
          사진: (r.사진 || []).filter(p => p && p.blob).map(p => ({ id: p.id || uid(), blob: p.blob, w: p.w, h: p.h, url: URL.createObjectURL(p.blob), 파일id: p.파일id || "", 올림: p.파일id ? "저장됨" : "대기", 오류: "" })) };
      }) }));

}

  S.사역.forEach(s => s.영수증.forEach(r => r.사진.forEach(p => { try { URL.revokeObjectURL(p.url); } catch (e) {} })));
  S.사역 = []; S.열린 = ""; S.제출ID = 새제출id();
}
function 나읽기() {
  const v = 저장읽기(나키) || 저장읽기(나키, true);
  if (v && typeof v === "object") for (const k in S.나) if (typeof v[k] === "string") S.나[k] = v[k];
  S.기억 = !!저장읽기(나키) || !저장읽기(나키, true);
